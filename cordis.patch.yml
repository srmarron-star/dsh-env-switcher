# dsh-env-switcher bundle patch layer.
# Config: override any field to match your machine (see README).
- insert:
    - id: dsh-env-switcher
      name: dsh-env-switcher
      config:
        winPort: 8080
        wslPort: 8081
        wslDistro: DSH
        wslNodeBin: /usr/bin
        wslLog: /mnt/l/JAVIS/DSH/20_Config_WSL/dsh-web.log
        winLog: L:\JAVIS\DSH\10_Config\dsh-windows.log
        winWorkingDir: L:\JAVIS\DSH\30_Source

